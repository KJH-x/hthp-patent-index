<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高温热泵专利情报库</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📑</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🌡️</span>
      <div>
        <h1>高温热泵专利情报库</h1>
        <p class="sub" id="metaLine">加载中…</p>
      </div>
    </div>
    <div class="head-right">
      <nav class="tabs">
        <button class="tab active" data-view="list">专利列表</button>
        <button class="tab" data-view="stats">统计分析</button>
        <button class="tab" data-view="map">专利地图</button>
        <button class="tab" data-view="about">说明</button>
      </nav>
      <div class="switch-area">
        <div class="view-toggle" id="viewToggle">
          <button id="btnTable" type="button" class="vt-btn" title="表格视图（行列表）"><span class="vt-ico">☰</span><span class="vt-label">表格</span></button>
          <button id="btnCard" type="button" class="vt-btn" title="卡片视图（网格卡片）"><span class="vt-ico">▤</span><span class="vt-label">卡片</span></button>
        </div>
        <button id="btnTheme" type="button" class="switch-btn" title="主题：跟随系统主题（点击切换）">
          <span class="vt-ico" id="themeIco">🅰️</span><span class="vt-label" id="themeLbl">A</span>
        </button>
        <button id="btnKw" type="button" class="switch-btn" title="标题关键词下划线标注" aria-pressed="false">
          <span class="vt-ico">＿</span><span class="vt-label">标注</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 列表视图 -->
  <section id="view-list" class="view active">
    <div class="toolbar">
      <input id="searchInput" type="search" placeholder="搜索标题/摘要/申请人/专利号…（支持拼音，如 rebeng / gaowenrebeng）">
      <select id="dirFilter"><option value="">全部方向</option></select>
      <select id="yearFilter"><option value="">全部年份</option></select>
      <select id="appFilter"><option value="">全部申请人</option></select>
      <select id="ipcFilter"><option value="">全部IPC</option></select>
      <select id="legalFilter"><option value="">全部法律状态</option></select>
      <select id="countryFilter"><option value="">全部国家</option></select>
      <label class="fam-toggle" title="同一专利族只显示主记录（授权优先）">
        <input type="checkbox" id="famToggle"> 折叠同族
      </label>
      <label class="fam-toggle" title="只看已收藏的专利">
        <input type="checkbox" id="favToggle"> 只看收藏
      </label>
      <span class="result-count" id="resultCount"></span>
      <button id="btnCsv" type="button" class="export-btn" title="导出当前筛选结果为 CSV（Excel 可直接打开）">⬇ 导出 CSV</button>
    </div>
    <div class="list-area">
      <div class="table-wrap" id="tableWrap">
        <table id="patentTable">
          <thead>
            <tr>
              <th data-key="PN" class="sortable col-pn">公开号</th>
              <th data-key="TITLE" class="sortable col-title">标题</th>
              <th data-key="ANCS" class="sortable col-ancs">申请人</th>
              <th data-key="PBD" class="sortable col-pbd">公开日</th>
              <th data-key="Direction" class="sortable col-dir">方向</th>
              <th class="col-pdf">PDF</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="card-wrap hidden" id="cardWrap"></div>
      <div class="pager">
        <button id="prevBtn">上一页</button>
        <span id="pageInfo"></span>
        <button id="nextBtn">下一页</button>
        <label>每页 <select id="pageSize"><option>20</option><option>50</option><option selected>100</option><option>200</option><option value="all">全部</option></select></label>
      </div>
    </div>
  </section>

  <!-- 详情弹层 -->
  <div id="detailModal" class="modal hidden">
    <div class="modal-content" tabindex="-1">
      <button class="modal-close" id="modalClose">✕</button>
      <button class="modal-nav" id="detailPrev" type="button" title="上一篇（←）">← 上一篇</button>
      <button class="modal-nav" id="detailNext" type="button" title="下一篇（→）">下一篇 →</button>
      <button class="modal-copy" id="modalCopy" type="button" title="复制本件专利的深链（含当前筛选条件）">🔗 复制链接</button>
      <div id="detailBody"></div>
    </div>
  </div>

  <!-- 统计视图 -->
  <section id="view-stats" class="view">
    <div class="stat-cards" id="statCards"></div>
    <div class="charts">
      <div class="chart-box"><h3>公开年份分布</h3><div id="chartYear" class="chart"></div></div>
      <div class="chart-box"><h3>技术方向分布</h3><div id="chartDir" class="chart"></div></div>
      <div class="chart-box full"><h3>主要申请人 TOP25</h3><div id="chartApp" class="chart"></div></div>
      <div class="chart-box"><h3>IPC 主组 TOP10</h3><div id="chartIpc" class="chart"></div></div>
      <div class="chart-box"><h3>法律状态分布</h3><div id="chartLegal" class="chart"></div></div>
      <div class="chart-box full"><h3>申请年 × 方向（近6年 × TOP8）</h3><div id="chartAppYearDir" class="chart heat"></div></div>
    </div>
  </section>

  <!-- 专利地图视图 -->
  <section id="view-map" class="view">
    <div class="charts">
      <div class="chart-box full"><h3>关键词词云（标题+摘要，KW_DICT 206 词）</h3><div id="kwCloud" class="chart cloud"></div></div>
      <div class="chart-box full"><h3>关键词共现网络（TOP25，点击节点搜索该关键词）</h3><div id="kwNet" class="chart net"></div></div>
      <div class="chart-box full"><h3>申请人合作网络（同一专利多申请人连边，点击节点筛选申请人）</h3><div id="appNet" class="chart net"></div></div>
      <div class="chart-box full"><h3>地域分布（按国家，点击查看该国专利）</h3><div id="regionChart" class="chart"></div></div>
    </div>
  </section>

  <!-- 说明视图 -->
  <section id="view-about" class="view">
    <div class="about">
      <h2>关于本库</h2>
      <p id="aboutText"></p>
    </div>
  </section>

  <script src="pinyin.js"></script>
  <script src="app.js"></script>
</body>
</html>
